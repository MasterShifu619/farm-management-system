<div class="page" style="max-width: 420px">
  <div class="card">
    <h2>Login</h2>

    <form (ngSubmit)="onSubmit()" style="flex-direction: column; align-items: stretch">
      <label>
        Username
        <input [(ngModel)]="username" name="username" required />
      </label>
      <label>
        Password
        <input type="password" [(ngModel)]="password" name="password" required />
      </label>
      <button type="submit">Login</button>
    </form>

    <p *ngIf="error()" class="error-text">{{ error() }}</p>

    <p class="hint-text">
      Seeded users (password <code>password123</code>): producer1, producer2, producer3, reviewer1, official_nc,
      official_sc
    </p>
  </div>
</div>
