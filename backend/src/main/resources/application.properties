spring.application.name=backend

spring.datasource.url=jdbc:h2:mem:farmdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Demo-only secret; a real deployment would pull this from an environment variable/secrets manager
app.jwt.secret=dev-only-secret-key-for-farm-management-system-demo-32bytes-min
app.jwt.expiration-ms=3600000

# Expose /actuator/health and /actuator/prometheus for the Grafana/Prometheus stack in monitoring/
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
